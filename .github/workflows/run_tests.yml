name: Run Tests
on:
  push:
    branches: [main]          # run when commits land on main (e.g. after a merge)
  pull_request:
    branches: [main]          # run on every PR that targets main

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'     

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Type-check and build
        run: npm run build
      
